name: Soha yangiliklari
# uzcharm.uz dagi yangi xabarlar saytga o'zi tushadi (har 30 daqiqada)
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: soha
jobs:
  yangila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/soha.py assets/soha.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/soha.json
          git diff --cached --quiet || { git commit -m "Soha yangiliklari yangilandi" && git push; }
